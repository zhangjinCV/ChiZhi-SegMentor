name: Feature request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 模块
      options:
        - 单图工作台
        - 批量工作台
        - 标注格式
        - 导出
        - 模型/推理
        - 打包/安装
        - 文档
        - 其他
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充信息

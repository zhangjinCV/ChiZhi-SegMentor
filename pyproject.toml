[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chizhi-segmentor"
version = "0.1.0"
description = "Chizhi SegMentor — box-prompted segmentation desktop workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "CHIZHI LAB" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pillow>=10.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9",
  "pyyaml>=6.0",
  "torch>=2.2,<3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyinstaller>=6.8",
  # only needed by scripts/parity_check.py against the original model6ch repo
  "timm==0.9.16",
  "torchvision>=0.17",
]

[project.scripts]
boxmask = "boxmask.cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
boxmask = ["vendor/REPVIT_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = [
  "real_model: requires the frozen checkpoint and torch",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
  "backend/boxmask/vendor",
  "backend/dist",
  "backend/build",
  "apps/web/dist",
  "node_modules",
  ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
